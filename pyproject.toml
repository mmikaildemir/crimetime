[project]
name = "crimetime"
version = "0.1.0"
description = "NYS criminal sentencing data model and decision engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "streamlit",
    "pandas",
    "requests",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
