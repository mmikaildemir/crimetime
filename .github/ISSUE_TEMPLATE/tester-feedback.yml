name: Tester feedback
description: Report something that is wrong or broken on the CrimeTime test site.
title: "[Feedback] "
labels: ["tester-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! This is a **test site, not actual CrimeTime**.
        Please don't include real defendant names or other personal information — issues on this repository are public.
  - type: textarea
    id: what_happened
    attributes:
      label: What went wrong?
      description: What did you do, and what did the site show?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: The correct sentence, statute, or behaviour — with a cite if you have one.
  - type: textarea
    id: context
    attributes:
      label: Case context (filled in automatically)
      description: The offense, case facts, engine result and build you were looking at. Edit or remove anything you don't want to share.
      render: json
